    <!-- ===== En-tête commun : chargé depuis entete.html par entete.js ===== -->
    <div id="entete"></div>

    <h2>Nos catégories</h2>

    <div class="scene">
      <div class="anneau">
        <div class="carte c1" style="--i: 0">
          <span><img src="iconBootstrap/fruit.png" alt="" /></span>
          Boissons et rafraicissements
        </div>
        <div class="carte c2" style="--i: 1">
          <span><img src="iconBootstrap/fuel-pump-fill.svg" alt="" /></span>
          essence
        </div>
        <div class="carte c3" style="--i: 2">
          <span><img src="iconBootstrap/panier.png" alt="" /></span>
          Épicerie
        </div>
        <div class="carte c4" style="--i: 3">
          <span><img src="iconBootstrap/quincaillerie.png" alt="" /></span>
          Quincaillerie
        </div>
        <div class="carte c5" style="--i: 4">
          <span><img src="iconBootstrap/hygenique.png" alt="" /></span>
          Savon et produits hygiéniques
        </div>
        <div class="carte c6" style="--i: 5">
          <span><img src="iconBootstrap/automobile.png" alt="" /></span>
          Automobile
        </div>
        <div class="carte c7" style="--i: 6">
          <span><img src="iconBootstrap/people.svg" alt="" /></span>
          Notre équipe
        </div>
      </div>
      <div class="commandes">
        <button id="prec" aria-label="Précédent">‹</button>
        <button id="suiv" aria-label="Suivant">›</button>
      </div>
    </div>

    <div class="voile" id="voile">
      <div class="fenetre">
        <div class="gros-plan" id="grosPlan"></div>
        <button class="fermer" id="fermer" aria-label="Fermer">✕</button>
      </div>
    </div>

    <!-- ===== Carte photo plein écran (s'ouvre depuis une tuile qui a une photo) ===== -->
    <div class="voile voile-photo" id="voilePhoto">
      <div class="fenetre">
        <div class="carte-photo">
          <img id="photoGrande" src="" alt="" />
          <div class="saveurs" id="photoSaveurs" hidden></div>
          <div class="legende" id="photoLegende" hidden></div>
          <div class="achat" id="photoAchat" hidden>
            <span class="achat-prix" id="photoPrix"></span>
            <a class="achat-lien" id="photoAjouter" href="#"><i class="bi bi-cart-plus"></i> Ajouter au panier</a>
          </div>
        </div>
        <button class="fermer" id="fermerPhoto" aria-label="Fermer la photo">✕</button>
      </div>
    </div>

    <!-- ##################################################################
         SCRIPT 1 (fichier externe) : Bootstrap
         Fait fonctionner le menu déroulant « Créer un profil », le menu
         latéral « Menu » et la fenêtre « Se connecter ».
         ################################################################## -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="entete.js"></script>

    <!-- ##################################################################
         SCRIPT 2 (dans la page) : deux parties
           A) CARROUSEL des catégories      -> blocs A1 à A5
           B) FORMULAIRE « Créer un profil » -> blocs B1 à B5
         ################################################################## -->
    <script>
      /* ##################################################################
         PARTIE A : CARROUSEL DES CATÉGORIES
         ################################################################## */

      /* ===== A1 : rotation du carrousel (flèches ‹ et ›) ===== */
      const anneau = document.querySelector(".anneau");
      const angleParCarte = 360 / 7; // 7 cartes
      let angle = -6 * angleParCarte; // départ : 7e carte (Notre équipe) devant

      function tourner() {
        anneau.style.transform = `translateZ(-240px) rotateY(${angle}deg)`;
      }

      /* position de départ, sans animation */
      anneau.style.transition = "none";
      tourner();
      anneau.offsetHeight; // force l'application avant de remettre l'animation
      anneau.style.transition = "";

      document.getElementById("suiv").addEventListener("click", function () {
        angle -= angleParCarte;
        tourner();
      });

      document.getElementById("prec").addEventListener("click", function () {
        angle += angleParCarte;
        tourner();
      });

      /* ===== A2 : départements de chaque catégorie (les tuiles du zoom) =====

      const sousListes = {

          { nom: "Maïs Sélection", icone: "image/conserve/maisSelection.jpg", photo: "image/conserve/maisSelection.jpg", prix: "2,00 $" },

          { nom: "pois Sans nom", icone: "image/conserve/poisSansNom.jpeg", photo: "image/conserve/poisSansNom.jpeg", prix: "0,99 $" },
          { nom: "pois Sans nom", icone: "image/conserve/poisSelection.jpg", photo: "image/conserve/poisSelection.jpg", prix: "1,15 $" },

          { nom: "Fève au lard à l'ancienne Clark", icone: "image/conserve/feve-au-lardClarkAncienne.png", photo: "image/conserve/feve-au-lardClarkAncienne.png", prix: "2,85 $" },
          { nom: "Fève au lard sirop d'érable Sélection", icone: "image/conserve/feveSiropErableSelection.jpg", photo: "image/conserve/feveSiropErableSelection.jpg", prix: "3,25 $" },
        ],
        pain: [
          { nom: "Pain sandwich", icone: "image/painsPatisserie/gadoua.jpg", photo: "image/painsPatisserie/gadoua.jpg", prix: "3,50 $" },
          { nom: "Pain bon matin super grain", icone: "image/painsPatisserie/bonMatin.png", photo: "image/painsPatisserie/bonMatin.png", prix: "4,85 $" },

          { nom: "Tortillas Pom (2 pour 10,00 $)", icone: "image/painsPatisserie/Tortillas.png", photo: "image/painsPatisserie/Tortillas.png", prix: "10,00 $" },
          { nom: "Tortillas Gadoua", icone: "image/painsPatisserie/tortillasGadoua.jpg", photo: "image/painsPatisserie/tortillasGadoua.jpg", prix: "5,99 $" },
          { nom: "Pain hotdog Sélection", icone: "image/painsPatisserie/hotdog.jpg", photo: "image/painsPatisserie/hotdog.jpg", prix: "3,50 $" },

          { nom: "Pain hamburger signature Pom", icone: "image/painsPatisserie/hamburger.jpg", photo: "image/painsPatisserie/hamburger.jpg", prix: "4,50 $" },
          { nom: "Pain hamburger ultra-moelleux Pom", icone: "image/painsPatisserie/hamburger.png", photo: "image/painsPatisserie/hamburger.png", prix: "4,00 $" },
          { nom: "Pain sous-marin ultra-moelleux Pom", icone: "image/painsPatisserie/sous-marin.jpg", photo: "image/painsPatisserie/sous-marin.jpg", prix: "5,75 $" },
          { nom: "Pain sous-marin Betty", icone: "image/painsPatisserie/specialty-submarine_trans.png", photo: "image/painsPatisserie/specialty-submarine_trans.png", prix: "4,00 $" },
        ],
        patisseries: [
          { nom: "Gateaux Vachon Jos-Louis", icone: "image/painsPatisserie/josLouis.jpg", photo: "image/painsPatisserie/josLouis.jpg", prix: "6,99 $" },
          { nom: "Gateaux Vachon caramel", icone: "image/painsPatisserie/vachonCaramel.jpg", photo: "image/painsPatisserie/vachonCaramel.jpg", prix: "6,99 $" },
          { nom: "Gateaux caramel Chevalier", icone: "image/painsPatisserie/caramel.png", photo: "image/painsPatisserie/caramel.png", prix: "4,50 $" },
          { nom: "Éclair au chocolat", icone: "image/painsPatisserie/Eclair-1.jpg", photo: "image/painsPatisserie/Eclair-1.jpg", prix: "4,95 $" },
          { nom: "Beignes au sucre en poudre Sélection", icone: "image/painsPatisserie/beigne.jpg", photo: "image/painsPatisserie/beigne.jpg", prix: "4,25 $" },
        ],
      };

      /*----- Dept_equipe : tuiles du zoom « Notre équipe » (noms à remplacer par les vrais) ------*/

      const dep_equipe = {
        "notre equipe": [
          {
            Fonction: "Gérant",
            icone: "image/Dan.png",
            photo:"image/Dan.png",
            nom:"Dan",
           
          },

          {
            Fonction: "Assistante-Gérante",
            icone: "image/isabelle.png",
            photo: "image/isabelle.png",
            nom: "Isabelle",
          },

          {
            Fonction: "Caissier",
            icone: "image/Noa.png",
            photo:"image/Noa.png",
            nom:"Noa",
          },
          {
           Fonction : "Caissière",
            icone: "image/Laurie.png",
            photo:"image/Laurie.png",
            nom:"Laurie"
          },
          {
            Fonction: "Commis",
            icone: "image/Sam.png",
            photo:"image/Sam.png",
             nom:"Sam"
          },

           {
            Fonction: "Caissière",
            icone: "image/Britany.png",
            photo:"image/Britany.png",
            nom:"Britany"
          },

           

          {
            Fonction: "Épicier-Boucher",
            icone: "image/Paul.png",
            photo:"image/Paul.png",
            nom: "Paul",
            
          },



        ],
      };

      /*----- Dept_auto ------*/

      
      const dep_auto = {
        automobile: [
          {
            nom: "Courroie",
            icone: "iconBootstrap/courroie.png",
            lien: "automobile-courroie.html",
          },
          {
            nom: "Lave glace",
            icone: "iconBootstrap/essuie-glace.png",
            lien: "automobile-lave-glace.html",
          },
          {
            nom: "Antigel",
            icone: "iconBootstrap/antigel.png",
            lien: "automobile-antigel.html",
          },
          {
            nom: "Huile",
            icone: "iconBootstrap/huile.png",
            lien: "automobile-huile.html",
          },
        ],
      };

      /*------ Savon et produits hygiéniques (mini-carrousel de produits) ------*/
      /* La clé = nom de la carte, minuscules et sans accent */

      const dep_savon = {
        "savon et produits hygieniques": [
          {
            nom: "Papier hygiénique",
            icone: "image/papier-hygienique.png",
            photo: "image/papier-hygienique.png",
            prix: "5.99 $",
          },
          {
            nom: "Essui-tout",
            icone: "image/essui-tout.png",
            photo: "image/essui-tout.png",
            prix: "7.99 $",
          },
        ],
      };

      /*------ boissons rafraichissantes------*/

      const dep_rafrai = {
        "boissons et rafraicissements": [
          {
            nom: "Barbotine",
            icone: "iconBootstrap/fruit.png",
            photo: "image/popEslush.png",
            saveurs: ["Cerise", "Bleuet", "Lime"],
            lien: "equipe.html",
          },
          {
            nom: "Eau de source",
            icone: "iconBootstrap/bouteille-deau.png",
            photo: "image/viva.png",
            lien: "equipe.html",
          },
          {
            nom: "Boissons énergétiques",
            icone: "iconBootstrap/boisson-energisante.png",
            photo: "image/energie.png",
            saveurs: ["Cerise", "Bleuet", "Lime","orange","melon"],
            lien: "equipe.html",
          },
          
        ],
      };



      /* ===== A3 : promotions (bandeau jaune du zoom) — mêmes clés que A2 ===== */

      const promos = {
        essence: "Tous les jeudis : 0,03 $/litre de rabais sur le super",
      };

      /* A3 (suite) : carte privilège affichée dans le zoom (mêmes clés) */
      const privileges = {
        essence: {
          image: "image/membre.png",
          texte: "Demandez notre carte privilège et accumulez des points applicables sur vos prochains ravitaillements!",
        },
      };

      /* A3 (outil) : transforme le nom d'une carte en clé (minuscules, sans accent) */
      function cle(texte) {
        return texte
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/\s+/g, " ")
          .trim()
          .toLowerCase();
      }

      

      /* ===== A3 (suite) : toutes les listes de départements dans un seul objet =====
         Pour ajouter une catégorie : créer sa liste ci-dessus, puis l'ajouter ici. */
      const listes = Object.assign({}, departements, dep_auto, dep_equipe, dep_rafrai, dep_savon);

      /* ===== A4 (outil) : état et rotation du mini-carrousel de produits ===== */
      let miniAngle = 0; // angle actuel
      let miniPas = 0; // angle entre deux produits (360 / nombre de produits)
      let miniRayon = 0; // rayon de l'anneau en px

      /* place chaque carte sur l'anneau selon la largeur réelle de la carte */
      function placerMini() {
        const scene = grosPlan.querySelector(".mini-scene");
        if (!scene) return;
        const cartes = grosPlan.querySelectorAll(".mini-carte");
        const n = cartes.length;
        const demiLargeur = scene.offsetWidth / 2;
        /* rayon : assez grand pour que les cartes ne se chevauchent pas
           (avec 1 ou 2 produits, les cartes tournent sur elles-mêmes) */
        miniRayon = n < 3 ? 0 : Math.max(70, (demiLargeur + 14) / Math.tan(Math.PI / n));
        cartes.forEach(function (c, i) {
          c.style.transform = `rotateY(${i * miniPas}deg) translateZ(${miniRayon}px)`;
        });
      }

      /* construit le HTML du mini-carrousel pour une liste (produits, personnes, départements)
         Champs lus : nom, icone, photo (facultatif), prix, Fonction, saveurs, lien */
      function miniCarrousel(liste) {
        miniPas = 360 / liste.length;
        miniAngle = 0;
        let h = '<div class="mini-vide"></div>'; /* espace souple au-dessus */
        h += '<div class="mini-scene"><div class="mini-anneau">';
        liste.forEach(function (d) {
          const fonction = d.Fonction || d.fonction || "";
          let attrs = "";
          if (d.photo) attrs += ` data-photo="${d.photo}" data-nom="${d.nom}"`;
          if (d.prix) attrs += ` data-prix="${d.prix}"`;
          if (fonction) attrs += ` data-fonction="${fonction}"`;
          if (d.saveurs) attrs += ` data-saveurs="${d.saveurs.join("|")}"`;
          if (d.sous) attrs += ` data-sous="${d.sous}" data-nom="${d.nom}" data-icone="${d.icone}"`;
          /* vraie photo (icone = photo) : carrée, ou ronde pour une personne ;
             sinon c'est une icône : on l'affiche à sa vraie taille, sans l'étirer */
          const estPhoto = d.photo && d.icone === d.photo;
          const classeImg = estPhoto ? (fonction ? "portrait" : "") : "pictogramme";
          /* avec photo : la carte ouvre la photo ; sans photo : elle suit son lien */
          const lien = d.photo || d.sous ? "#" : d.lien || "#";
          h += `<a class="mini-carte" href="${lien}"${attrs}><img class="${classeImg}" src="${d.icone}" alt=""><span>${d.nom}</span>${fonction ? "<small>" + fonction + "</small>" : ""}</a>`;
        });
        h += "</div></div>";
        h += '<div class="mini-vide"></div>'; /* espace souple entre la carte et les flèches */
        h += '<div class="mini-commandes"><button type="button" class="mini-btn" data-sens="-1" aria-label="Précédent">‹</button><button type="button" class="mini-btn" data-sens="1" aria-label="Suivant">›</button></div>';
        return h;
      }

      function tournerMini() {
        const a = grosPlan.querySelector(".mini-anneau");
        if (a) {
          a.style.transform = `translateZ(-${miniRayon}px) rotateY(${miniAngle}deg)`;
        }
      }

      /* ===== A4 : zoom sur une carte (au clic) ===== */

      const voile = document.getElementById("voile");
      const grosPlan = document.getElementById("grosPlan");
      let carteOuverte = null; // carte du carrousel actuellement ouverte

      document.querySelectorAll(".carte").forEach(function (carte) {
        carte.addEventListener("click", function () {
          carteOuverte = carte; // pour le bouton « retour » des sous-listes
          const nom = cle(carte.textContent);
          let html = carte.innerHTML;

          if (promos[nom]) {
            html += `<p class="promo">${promos[nom]}</p>`;
          }

          if (privileges[nom]) {
            html += `<div class="privilege"><img src="${privileges[nom].image}" alt="Carte privilège Gas O Score"><p>${privileges[nom].texte}</p></div>`;
          }

          /* chaque catégorie qui a une liste de produits/personnes reçoit le même mini-carrousel */
          if (listes[nom]) {
            html += miniCarrousel(listes[nom]);
          }

          grosPlan.innerHTML = html;
          placerMini(); // place les cartes du mini-carrousel (s'il y en a un)
          tournerMini();
          grosPlan.className = "gros-plan " + carte.classList[1];
          voile.classList.add("visible");
        });
      });

      /* ===== A5 : fermeture du zoom (bouton ✕, clic sur le fond, touche Échap) ===== */

      function fermer() {
        voile.classList.remove("visible");
      }

      document.getElementById("fermer").addEventListener("click", fermer);

      voile.addEventListener("click", function (e) {
        if (e.target === voile) {
          fermer();
        }
      });

      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") {
          if (voilePhoto.classList.contains("visible")) {
            fermerPhoto(); // d'abord la photo
          } else {
            fermer();
          }
        }
      });


      /* ===== A6 : carte photo plein écran (clic sur une tuile qui a une photo) ===== */

      const voilePhoto = document.getElementById("voilePhoto");
      const photoGrande = document.getElementById("photoGrande");

      function fermerPhoto() {
        voilePhoto.classList.remove("visible");
      }

      /* la tuile garde son lien, sauf si elle a une photo : alors on ouvre la photo */
      let produitCourant = null; // produit affiché dans la grande photo (pour « Ajouter au panier »)

      grosPlan.addEventListener("click", function (e) {
        const tuile = e.target.closest(".tuile[data-photo], .mini-carte[data-photo]");
        if (!tuile) return;
        e.preventDefault();
        produitCourant = {
          nom: tuile.dataset.nom,
          prix: tuile.dataset.prix || "",
          photo: tuile.dataset.photo,
        };
        photoGrande.src = tuile.dataset.photo;
        photoGrande.alt = tuile.dataset.nom;

        /* texte sur la photo : les saveurs, s'il y en a */
        const boite = document.getElementById("photoSaveurs");
        const saveurs = tuile.dataset.saveurs ? tuile.dataset.saveurs.split("|") : [];
        if (saveurs.length) {
          boite.innerHTML =
            "<strong>Saveurs disponibles:</strong><ul>" +
            saveurs.map(function (nom) {
              return "<li>" + nom + "</li>";
            }).join("") +
            "</ul>";
          boite.hidden = false;
        } else {
          boite.hidden = true;
        }
        /* bandeau nom + fonction, s'il y en a (équipe) */
        const legende = document.getElementById("photoLegende");
        if (tuile.dataset.fonction || tuile.classList.contains("mini-carte")) {
          legende.innerHTML =
            "<strong>" + tuile.dataset.nom + "</strong>" +
            (tuile.dataset.fonction ? "<span>" + tuile.dataset.fonction + "</span>" : "");
          legende.hidden = false;
        } else {
          legende.hidden = true;
        }
        /* barre prix + « Ajouter au panier », si le produit a un prix */
        const achat = document.getElementById("photoAchat");
        if (tuile.dataset.prix) {
          document.getElementById("photoPrix").textContent = tuile.dataset.prix;
          document.getElementById("photoAjouter").innerHTML = LABEL_AJOUT;
          achat.hidden = false;
        } else {
          achat.hidden = true;
        }
        /* la photo : produit entier (contain) ou plein cadre pour une personne (cover),
           et elle laisse la place aux bandeaux du haut et du bas */
        photoGrande.className = tuile.dataset.fonction ? "plein" : "";
        photoGrande.style.paddingTop = legende.hidden ? "0" : legende.offsetHeight + "px";
        photoGrande.style.paddingBottom = achat.hidden ? "0" : achat.offsetHeight + "px";
        voilePhoto.classList.add("visible");
      });

      /* carte de département qui ouvre une sous-liste de produits (ex. Conserves) :
         le zoom est remplacé par le carrousel des produits, avec un bouton « retour » */
      grosPlan.addEventListener("click", function (e) {
        const carteSous = e.target.closest(".mini-carte[data-sous]");
        if (!carteSous) return;
        e.preventDefault();
        const liste = sousListes[carteSous.dataset.sous];
        if (!liste) return;
        const titreParent = carteOuverte ? carteOuverte.textContent.trim().replace(/\s+/g, " ") : "Retour";
        grosPlan.innerHTML =
          '<button type="button" class="retour" id="retourListe">‹ ' + titreParent + "</button>" +
          '<span><img src="' + carteSous.dataset.icone + '" alt=""></span>' +
          carteSous.dataset.nom +
          miniCarrousel(liste);
        placerMini();
        tournerMini();
      });

      grosPlan.addEventListener("click", function (e) {
        if (e.target.closest("#retourListe") && carteOuverte) {
          carteOuverte.click(); // reconstruit le zoom de la carte d'origine
        }
      });

      /* boutons ‹ › du mini-carrousel de produits */
      grosPlan.addEventListener("click", function (e) {
        const bouton = e.target.closest(".mini-btn");
        if (!bouton) return;
        miniAngle -= Number(bouton.dataset.sens) * miniPas;
        tournerMini();
      });

      /* bouton « Ajouter au panier » : enregistre le produit dans le panier (ajouterAuPanier, SCRIPT 4) */
      const LABEL_AJOUT = '<i class="bi bi-cart-plus"></i> Ajouter au panier';
      let delaiAjout;

      document.getElementById("photoAjouter").addEventListener("click", function (e) {
        e.preventDefault(); // on reste sur la page : pas de changement de page
        if (typeof ajouterAuPanier === "function" && produitCourant) {
          ajouterAuPanier(produitCourant); // enregistre le produit (SCRIPT 4)
        } else if (typeof addToCart === "function") {
          addToCart(1);
        }
        /* petit message de confirmation pendant 1,2 seconde */
        const lien = this;
        lien.innerHTML = '<i class="bi bi-check-lg"></i> Ajouté';
        clearTimeout(delaiAjout);
        delaiAjout = setTimeout(function () {
          lien.innerHTML = LABEL_AJOUT;
        }, 1200);
      });

      document.getElementById("fermerPhoto").addEventListener("click", fermerPhoto);

      voilePhoto.addEventListener("click", function (e) {
        if (e.target === voilePhoto) {
          fermerPhoto();
        }
      });

    
      /* ##################################################################
         PARTIE B : FORMULAIRE « CRÉER UN PROFIL » (menu déroulant du header)
         ################################################################## */

      enteteChargee.then(() => {
        /* ===== B1 : éléments du formulaire et message d'état ===== */
        const form = document.getElementById("createProfileForm");
        if (!form) return; // page sans formulaire : on ne fait rien

        const toggleBtn = document.getElementById("createProfileDropdown");
        const password = document.getElementById("password");
        const confirmPassword = document.getElementById("confirmPassword");
        const nameFields = ["firstName", "lastName", "address", "city"].map(
          (id) => document.getElementById(id),
        );
        const dropdown = bootstrap.Dropdown.getOrCreateInstance(toggleBtn);
        const messageBox = document.getElementById("formMessage");

        function afficherMessage(texte, type) {
          messageBox.textContent = texte;
          messageBox.className = `alert alert-${type} mt-2 py-2 small`;
        }

        /* ===== B2 : adresse automatique (service Geoapify) =====
           Suggestions pendant la frappe + remplissage ville, province, code postal. */
        /* DÉMO GITHUB : clé retirée. Sans clé, l'autocomplétion est désactivée. */
        const GEOAPIFY_KEY = "";

        const liste = document.getElementById("suggestions");

        const champ = document.getElementById("address");
        let timer;

        const abreviations = {
          rte: "route",
          ch: "chemin",
          av: "avenue",
          boul: "boulevard",
        };

        function normaliser(texte) {
          let resultat = texte;
          for (const [abrev, mot] of Object.entries(abreviations)) {
            const regex = new RegExp(`\\b${abrev}\\b\\.?`, "gi");
            resultat = resultat.replace(regex, mot);
          }
          return resultat;
        }

        champ.addEventListener("input", () => {
          if (!GEOAPIFY_KEY) return; // pas de clé : pas de suggestions
          clearTimeout(timer);
          timer = setTimeout(async () => {
            const texte = champ.value.trim();
            if (texte.length < 3) {
              liste.innerHTML = "";
              return;
            }

            console.log("tapé :", texte, "| envoyé :", normaliser(texte));

            const url = `https://api.geoapify.com/v1/geocode/autocomplete?text=${encodeURIComponent(normaliser(texte))}&apiKey=${GEOAPIFY_KEY}`;
            const response = await fetch(url);
            if (!response.ok) return;

            const data = await response.json();
            console.log(
              "réponse pour",
              texte,
              "→",
              data.features.length,
              "résultats",
            );
            liste.innerHTML = "";
            data.features.forEach((feature) => {
              const item = document.createElement("button");
              item.type = "button";
              item.className = "list-group-item list-group-item-action small";
              item.textContent = feature.properties.formatted;
              item.addEventListener("click", () => {
                const p = feature.properties;
                champ.value = [p.housenumber, p.street]
                  .filter(Boolean)
                  .join(" ");
                document.getElementById("city").value = p.city || "";
                document.getElementById("province").value = p.state_code || "";
                document.getElementById("postalCode").value = p.postcode || "";
                liste.innerHTML = "";
              });
              liste.appendChild(item);
            });
          }, 300);
        });

        /* ===== B3 : validation (champs requis, mots de passe identiques) ===== */
        function validateCustom() {
          nameFields.forEach((f) =>
            f.setCustomValidity(f.value.trim() === "" ? "Champ requis" : ""),
          );
          confirmPassword.setCustomValidity(
            confirmPassword.value !== password.value ? "Différent" : "",
          );
        }

        form.addEventListener("input", validateCustom);

        /* ===== B4 : envoi du formulaire au serveur (POST http://localhost:3000/clients) ===== */
        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          validateCustom();
          form.classList.add("was-validated");

          if (!form.checkValidity()) {
            form.querySelector(":invalid")?.focus();
            return;
          }

          const data = Object.fromEntries(new FormData(form));
          delete data.confirmPassword;

          try {
            const response = await fetch("http://localhost:3000/clients", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(data),
            });
            const result = await response.json();
            console.log(response.status, result);
            if (response.ok) {
              afficherMessage("Profil créé !", "success");
              setTimeout(resetForm, 2000);
            } else {
              afficherMessage(result.message, "danger");
            }
          } catch (err) {
            afficherMessage("Impossible de joindre le serveur.", "danger");
          }
        });

        /* ===== B5 : bouton Annuler et remise à zéro du formulaire ===== */
        document
          .getElementById("cancelProfile")
          .addEventListener("click", resetForm);

        function resetForm() {
          form.reset();
          form.classList.remove("was-validated");
          nameFields
            .concat(confirmPassword)
            .forEach((f) => f.setCustomValidity(""));
          dropdown.hide();
        }
      });
   

    /* ===== fin du SCRIPT 2 ===== */
    
    </script>

    <!-- ##################################################################
         SCRIPT 3 (fichier externe) : script.js — JS commun du site
         ################################################################## -->
    <!-- script.js est maintenant chargé par entete.js, une fois l'en-tête en place -->

    <!-- ##################################################################
         SCRIPT 4 (dans la page) : contenu du panier (panneau « Mon panier »)
           - les produits sont gardés dans le navigateur (localStorage, clé "cartItems")
           - le petit compteur rouge (script.js) est toujours égal au nombre d'articles
         ################################################################## -->
    <script>
      /* ===== C1 : lire / écrire la liste des produits du panier ===== */
      const PANIER_KEY = "cartItems";

      function lirePanier() {
        try {
          return JSON.parse(localStorage.getItem(PANIER_KEY) || "[]");
        } catch (e) {
          return [];
        }
      }

      function ecrirePanier(items) {
        localStorage.setItem(PANIER_KEY, JSON.stringify(items));
        /* le compteur rouge = total des quantités */
        const total = items.reduce(function (somme, it) {
          return somme + it.qte;
        }, 0);
        if (typeof setCartCount === "function") {
          setCartCount(total);
        }
      }

      /* ===== C2 : outils de prix ("5.99 $" -> 5.99, puis 5.99 -> "5,99 $") ===== */
      function prixNombre(texte) {
        return parseFloat(String(texte).replace(",", ".").replace(/[^0-9.]/g, "")) || 0;
      }

      function formaterPrix(nombre) {
        return nombre.toFixed(2).replace(".", ",") + " $";
      }

      function echapper(texte) {
        const d = document.createElement("div");
        d.textContent = texte;
        return d.innerHTML;
      }

      /* ===== C3 : ajouter, changer la quantité, vider ===== */
      function ajouterAuPanier(produit) {
        const items = lirePanier();
        /* un produit = sa photo (deux produits peuvent porter le même nom) */
        const existant = items.find(function (it) {
          return it.photo === produit.photo;
        });
        if (existant) {
          existant.qte += 1;
        } else {
          items.push({ nom: produit.nom, prix: produit.prix, photo: produit.photo, qte: 1 });
        }
        ecrirePanier(items);
        afficherPanier();
      }

      function changerQuantite(index, delta) {
        const items = lirePanier();
        if (!items[index]) return;
        items[index].qte += delta;
        if (items[index].qte <= 0) {
          items.splice(index, 1); // quantité 0 : le produit sort du panier
        }
        ecrirePanier(items);
        afficherPanier();
      }

      function viderPanier() {
        ecrirePanier([]);
        afficherPanier();
      }

      /* ===== C4 : afficher le contenu dans le panneau ===== */
      function afficherPanier() {
        const zone = document.getElementById("panierContenu");
        const items = lirePanier();

        if (items.length === 0) {
          zone.innerHTML = '<p class="text-muted">Votre panier est vide.</p>';
          return;
        }

        let total = 0;
        let html = '<ul class="list-unstyled mb-0">';
        items.forEach(function (it, i) {
          total += prixNombre(it.prix) * it.qte;
          html +=
            '<li class="d-flex align-items-center gap-2 mb-3">' +
            '<img src="' + echapper(it.photo) + '" alt="" width="56" height="56" class="rounded" style="object-fit: cover">' +
            '<div class="flex-grow-1"><div class="fw-bold">' + echapper(it.nom) + '</div>' +
            '<div class="text-muted small">' + echapper(it.prix) + '</div></div>' +
            '<div class="d-flex align-items-center gap-1">' +
            '<button type="button" class="btn btn-sm btn-outline-secondary" data-i="' + i + '" data-delta="-1" aria-label="Retirer un">−</button>' +
            '<span class="px-1">' + it.qte + '</span>' +
            '<button type="button" class="btn btn-sm btn-outline-secondary" data-i="' + i + '" data-delta="1" aria-label="Ajouter un">+</button>' +
            '</div></li>';
        });
        html += "</ul><hr>";
        html += '<div class="d-flex justify-content-between fw-bold"><span>Total</span><span>' + formaterPrix(total) + "</span></div>";
        html += '<button type="button" class="btn btn-outline-danger btn-sm mt-3" id="viderPanier">Vider le panier</button>';
        zone.innerHTML = html;
      }

      /* clics sur − / + et « Vider le panier » (un seul écouteur pour tout le panneau) */
      enteteChargee.then(function () {
        document.getElementById("panierContenu").addEventListener("click", function (e) {
          const bouton = e.target.closest("button");
          if (!bouton) return;
          if (bouton.id === "viderPanier") {
            viderPanier();
          } else if (bouton.dataset.delta) {
            changerQuantite(Number(bouton.dataset.i), Number(bouton.dataset.delta));
          }
        });

        /* ===== C5 : au chargement et à l'ouverture du panneau ===== */
        ecrirePanier(lirePanier()); // remet le compteur rouge d'accord avec la liste
        afficherPanier();

        document
          .getElementById("offcanvasPanier")
          .addEventListener("show.bs.offcanvas", afficherPanier);
      });
    </script>
  </body>
